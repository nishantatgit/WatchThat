[project]
name = "representational-learning"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "azure-data-tables>=12.7.0",
    "azure-identity>=1.25.3",
    "azure-servicebus>=7.14.3",
    "azure-storage-blob>=12.30.0",
    "pillow>=12.3.0",
    "pyyaml>=6.0.3",
    "torch>=2.13.0",
    "torchvision>=0.28.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/representation_learning"]
