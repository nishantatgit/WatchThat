  name: image-feature-store
  offline_store: adls
  online_store: managed_redis

deployment:
  container_registry_name: null
  container_app_environment: image-platform-environment
  inference_app_name: image-inference-api

messaging:
  fully_qualified_namespace: sb-reprlearn-nishant-dev.servicebus.windows.net
  ingestion_queue: image-ingestion
  download_queue: image-downloads