user_uploads:
  enabled: true
  process_immediately: true
  maximum_file_size_mb: 10

scraping:
  enabled: true
  schedule: "0 2 * * *"
  quarantine_by_default: true

  seed_urls:
    - "https://commons.wikimedia.org/wiki/Category:Birds"

  discovery_source: "wikimedia"

  wikimedia_categories:
    - "Featured pictures of birds"

  allowed_page_hosts:
    - "commons.wikimedia.org"

  allowed_image_hosts:
    - "upload.wikimedia.org"

  require_license: true

  allowed_licenses:
    - "CC0"
    - "CC BY 4.0"
    - "CC BY-SA 4.0"
    - "CC BY-SA 3.0"
    - "Public domain"

  maximum_pages: 1
  maximum_depth: 0
  maximum_images_per_run: 5
  maximum_image_size_mb: 10

validation:
  supported_formats:
    - jpg
    - jpeg
    - png
    - webp
  minimum_width: 128
  minimum_height: 128
  reject_corrupt_images: true
  exact_deduplication: true
  perceptual_deduplication: true
